# ビルドキャッシュ:
#   main ブランチの CI（publish-build-cache.yml）が、各層のビルドキャッシュを GHCR に push している。
#   cache_from でそれを参照し、キャッシュがある層はダウンロード、無い層だけをローカルでビルドする。
#   アーキテクチャごとにキャッシュを分けているため両方を並べる（合わないものは使われない）。
#   既定の docker ドライバーでは、containerd image store が有効な場合にのみ使われる
#   （無効な場合は無視され、通常どおりビルドされる）。
#   キャッシュが当たるのはビルド引数が既定値（UID / GID / USER_NAME / TZ）の場合。
services:
  ###########################################################################
  # user: ユーザ環境。VS Code がアタッチする側。
  #   ai コンテナへは ssh（ai コマンド）で入る。
  #   docker.sock はマウントしない（ビルドなどで悪意あるスクリプトが動いても、
  #   ホストの Docker を操作させないため）。コンテナの操作はホストで行う。
  ###########################################################################
  user:
    build:
      context: docker-images
      dockerfile: Dockerfile
      target: user
      args:
        TZ: Asia/Tokyo
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        USER_NAME: ${USER_NAME:-dev}
        USER_PASS: ${USER_PASS:-dev}
      cache_from:
        - type=registry,ref=ghcr.io/diiva-szk/devcontainer-env-core/build-cache:user-amd64
        - type=registry,ref=ghcr.io/diiva-szk/devcontainer-env-core/build-cache:user-arm64
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
    volumes:
      # プロジェクトの中にdev-envを置く場合、../../ はプロジェクトルートになるので、VS Codeのワークスペースとして使える。
      - ../../:/home/${USER_NAME:-dev}/work:delegated
      # ai コンテナへ ssh で入るための鍵の受け渡し（ai コマンドと ai の start-sshd が使う）。
      #   client: user が書き出すクライアントの公開鍵（ai は読み取り専用）
      #   host:   ai が書き出すホスト鍵の公開鍵（user は読み取り専用）
      - ai-ssh-client:/var/lib/ai-ssh/client
      - ai-ssh-host:/var/lib/ai-ssh/host:ro
    working_dir: /home/${USER_NAME:-dev}/work
    # ENTRYPOINT(entrypoint.sh) + この command が exec される
    command:
      - sleep
      - infinity

  ###########################################################################
  # ai: AIエージェント環境。
  #   sudo なし / AWS 認証情報なし / docker.sock なし。
  #   AI エージェントが操作するブラウザ用のデスクトップ（KasmVNC）を持つ。
  #   user コンテナからの入り口として ssh サーバー（root を使わずに動かす）を持つ。
  ###########################################################################
  ai:
    build:
      context: docker-images
      dockerfile: Dockerfile
      target: ai
      args:
        TZ: Asia/Tokyo
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        USER_NAME: ${USER_NAME:-dev}
      cache_from:
        - type=registry,ref=ghcr.io/diiva-szk/devcontainer-env-core/build-cache:ai-amd64
        - type=registry,ref=ghcr.io/diiva-szk/devcontainer-env-core/build-cache:ai-arm64
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      # デスクトップ（KasmVNC）のログインパスワード（ユーザー名は USER_NAME）
      KASMVNC_PASSWORD: ${KASMVNC_PASSWORD:-dev}
      # このコンテナには CAP_SYS_ADMIN が無く unprivileged user namespace も使えないため、
      # Chrome のサンドボックスが起動できない（agent-browser は既定で --no-sandbox を付けるため対象外）。
      # playwright-cli 用に既定で無効化しておく。
      PLAYWRIGHT_MCP_SANDBOX: "false"
      # git の署名に使う SSH の秘密鍵（中身）。空なら署名しない。
      #   ai-entrypoint.sh（setup-git-signing）がファイルに書き出して ~/.gitconfig に設定し、
      #   AI エージェントのセッションには引き継がない。
      GIT_SIGNING_KEY: ${GIT_SIGNING_KEY:-}
    # デスクトップ（KasmVNC）と ssh サーバーのポート。ホストには公開せず（ports は書かない）、
    # 同じネットワークの user コンテナからだけ接続させる。
    #   8444: デスクトップ。ホストからは user コンテナの ai-desktop（aid）が VS Code のポート転送経由で開く。
    #   2222: ssh サーバー。user コンテナの ai コマンドが接続する。
    expose:
      - "8444"
      - "2222"
    volumes:
      - ../../:/home/${USER_NAME:-dev}/work:delegated
      # 各 AI ツールの認証情報と会話履歴を、コンテナを作り直しても残す。
      #   名前を書かない（external にしない）ため、volume はプロジェクトごとに分かれる
      #   （実際の名前は "<プロジェクト名>_devcontainer_ai-claude" のようになる）。
      #   イメージが管理する設定（settings.json / skills / config.toml / cli.json）は
      #   volume に残り続けるため、イメージ側の更新は ai コンテナで
      #   sync-home-defaults を実行して反映する（起動時は無いものを作るだけ）。
      - ai-claude:/home/${USER_NAME:-dev}/.claude
      - ai-codex:/home/${USER_NAME:-dev}/.codex
      - ai-copilot:/home/${USER_NAME:-dev}/.copilot
      - ai-kiro:/home/${USER_NAME:-dev}/.kiro
      # Antigravity CLI（agy）。~/.gemini/antigravity-cli と ~/.gemini/config を含む
      - ai-gemini:/home/${USER_NAME:-dev}/.gemini
      # Kiro CLI の認証情報は ~/.kiro ではなく、こちらの secret store（data.sqlite3）にある
      - ai-kiro-data:/home/${USER_NAME:-dev}/.local/share/kiro-cli
      # Context7 CLI（ctx7）の認証情報（ctx7 login で作られる credentials.json）
      - ai-context7:/home/${USER_NAME:-dev}/.config/context7
      # ssh の鍵の受け渡し（user コンテナの volumes を参照。ai からはクライアントの鍵を書き換えられない）
      - ai-ssh-client:/var/lib/ai-ssh/client:ro
      - ai-ssh-host:/var/lib/ai-ssh/host
      # docker.sock は渡さない
    working_dir: /home/${USER_NAME:-dev}/work
    command:
      - sleep
      - infinity

###########################################################################
# volumes: ai コンテナの AI ツールの状態を残す。
#   消したいとき（ログインし直す・状態をまっさらにする）は、コンテナを止めてから
#   docker volume rm <プロジェクト名>_devcontainer_ai-claude のように削除する。
###########################################################################
volumes:
  ai-claude:
  ai-codex:
  ai-copilot:
  ai-kiro:
  ai-kiro-data:
  ai-gemini:
  ai-context7:
  # ai コンテナへ ssh で入るための鍵の受け渡し（中身は公開鍵だけ。消しても起動時に作り直される）
  ai-ssh-client:
  ai-ssh-host:
