name: Update mise lock

# mise 設定は locked = true のため、config.toml だけを更新すると mise.lock と不一致になり、
# イメージのビルドが失敗する。Renovate には lock を更新させず（skipArtifactsUpdate）、
# PR上でこのワークフローが lock を作り直して push する。
#
# 【構成】PR のコードを実行する generate ジョブと、書き込み用トークンを扱う push ジョブを
# 別ジョブ（= 別 runner）に分離する。同じ runner で PR のコード実行後にトークンを扱うと、
# PR のスクリプトや侵害されたイメージが .git/hooks 等を仕込み、後続の git 操作から
# トークンを盗めるため。push ジョブでは PR のコードを一切実行せず、受け取った lock の
# パス・形式を検証してから取り込む。
on:
  pull_request:
    paths:
      - 'docker-images/**/mise/config.toml'
      - 'docker-images/**/mise/mise.lock'
      # npm backend の依存グラフ（mise.lock が digest で参照するサイドカー）
      - 'docker-images/**/mise/.mise/locks/**'
      # mise 本体のバージョンが変わると lock の生成結果も変わり得る
      - 'docker-images/Dockerfile'
      - 'scripts/update-mise-locks.sh'
      - 'scripts/fill-mise-lock-checksums.sh'
      - '.github/workflows/update-mise-lock.yml'
  workflow_dispatch:

# 同一ブランチへ順に push するため、並行実行させない
concurrency:
  group: update-mise-lock-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # PR のコードを実行して lock を生成する。書き込み可能なトークン・シークレットは扱わない。
  generate:
    # フォークからのPRではシークレットを使えず、他者のブランチへ push すべきでもない
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      # push ジョブで同じコミットを基準にするため記録する（途中でブランチが進んだら push を失敗させる）
      - name: Record head commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # イメージに入る mise と同じバイナリで lock を生成するため、Dockerfile の
      # mise ステージと同じイメージ（タグ + digest）の中で実行する。
      - name: Regenerate mise.lock
        env:
          # mise lock が GitHub API を多用するため、レート制限回避用に読み取りトークンを渡す
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          image="$(sed -n 's/^FROM \(jdxcode\/mise:[^[:space:]]*\) AS mise$/\1/p' docker-images/Dockerfile)"
          if [ -z "$image" ]; then
            echo "Dockerfile から mise イメージを特定できませんでした" >&2
            exit 1
          fi
          echo "mise image: $image"

          # 公式イメージは MISE_DATA_DIR 等を root 所有の /mise に向けているため、
          # 実行ユーザが書き込める場所へ振り替える。
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --workdir /work \
            --env GITHUB_TOKEN \
            --env HOME=/tmp/home \
            --env MISE_DATA_DIR=/tmp/mise/data \
            --env MISE_CACHE_DIR=/tmp/mise/cache \
            --env MISE_CONFIG_DIR=/tmp/mise/config \
            --env MISE_STATE_DIR=/tmp/mise/state \
            --entrypoint bash \
            "$image" \
            scripts/update-mise-locks.sh

      # 受け渡すのは lock ファイルとサイドカー（npm backend の依存グラフ）の中身だけ。
      # lock はここで固定の名前に変換し、サイドカーは .mise/locks 配下の通常ファイルだけを
      # <stage>-locks/ にコピーする。作業ツリーのパス構造やシンボリックリンクを持ち出さない。
      - name: Collect lock files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mise-locks"
          mkdir -p "$out"
          declare -A dirs=(
            [dev-base]="docker-images/dev-base/etc/mise"
            [ai]="docker-images/ai/opt/mise"
            [user]="docker-images/user/opt/mise"
          )
          for stage in "${!dirs[@]}"; do
            dir="${dirs[$stage]}"
            cat "$dir/mise.lock" > "$out/$stage.lock"
            if [ -d "$dir/.mise/locks" ]; then
              # find はシンボリックリンクをたどらないため、得られるのは実ディレクトリ内の通常ファイルだけ
              (cd "$dir/.mise/locks" && find . -type f -printf '%P\n') | while IFS= read -r rel; do
                mkdir -p "$out/$stage-locks/$(dirname "$rel")"
                cat "$dir/.mise/locks/$rel" > "$out/$stage-locks/$rel"
              done
            fi
          done

      - name: Upload lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-locks
          path: ${{ runner.temp }}/mise-locks/
          if-no-files-found: error
          retention-days: 1

  # 検証済みの lock を PR ブランチへ push する。PR のコードは一切実行しない。
  push:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # generate ジョブと同じコミットを取得する。以降、作業ツリー内のスクリプト等は実行しない。
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.sha }}
          persist-credentials: false

      # 作業ツリーの外へ展開する
      - name: Download lock files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mise-locks
          path: ${{ runner.temp }}/mise-locks

      # 受け取った lock とサイドカーを検証し、決まったパスにだけ書き込む。
      # （このステップのスクリプトはワークフロー定義内のもので、PR 側のファイルは使わない）
      - name: Validate and apply lock files
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mise-locks"

          declare -A dirs=(
            [dev-base]="docker-images/dev-base/etc/mise"
            [ai]="docker-images/ai/opt/mise"
            [user]="docker-images/user/opt/mise"
          )

          # artifact に含まれてよいのは、3つの lock と、npm backend のサイドカー
          # （<stage>-locks/npm-<name>/<version>/{package.json,aube-lock.yaml}）とそのディレクトリだけ。
          # 各パス要素は英数字で始まるため、.. や隠しファイルは含まれない。
          sidecar_re='^(dev-base|ai|user)-locks/npm-[a-z0-9][a-z0-9._-]*/[0-9A-Za-z][0-9A-Za-z.+_-]*/(package\.json|aube-lock\.yaml)$'
          sidecar_dir_re='^(dev-base|ai|user)-locks(/npm-[a-z0-9][a-z0-9._-]*(/[0-9A-Za-z][0-9A-Za-z.+_-]*)?)?$'
          while IFS= read -r -d '' path; do
            rel="${path#"$src"/}"
            if [ -L "$path" ]; then
              echo "シンボリックリンクが含まれています: $rel" >&2
              exit 1
            elif [ -d "$path" ]; then
              if ! [[ "$rel" =~ $sidecar_dir_re ]]; then
                echo "想定外のディレクトリです: $rel" >&2
                exit 1
              fi
            elif [ -f "$path" ]; then
              case "$rel" in
                dev-base.lock | ai.lock | user.lock) ;;
                *)
                  if ! [[ "$rel" =~ $sidecar_re ]]; then
                    echo "想定外のファイルです: $rel" >&2
                    exit 1
                  fi
                  ;;
              esac
              # サイズが妥当であること
              if [ "$(stat -c %s "$path")" -gt 1048576 ]; then
                echo "$rel が大きすぎます" >&2
                exit 1
              fi
            else
              echo "通常ファイルではありません: $rel" >&2
              exit 1
            fi
          done < <(find "$src" -mindepth 1 -print0)

          for stage in "${!dirs[@]}"; do
            if [ ! -f "$src/$stage.lock" ]; then
              echo "$stage.lock がありません" >&2
              exit 1
            fi

            # mise.lock の形式であること（TOML として解釈でき、想定外のキーを含まない）。
            # npm backend のエントリは依存グラフ（aube）を必ず参照し、その digest がサイドカーと一致すること。
            # 参照されないサイドカーは受け付けない。
            python3 - "$src/$stage.lock" "$src/$stage-locks" <<'PY'
          import hashlib, json, os, re, sys, tomllib
          lock_path, sidecar_root = sys.argv[1], sys.argv[2]
          with open(lock_path, "rb") as f:
              data = tomllib.load(f)
          if set(data) - {"lockfile_version", "tools"}:
              sys.exit(f"想定外のキー: {sorted(set(data) - {'lockfile_version', 'tools'})}")
          if data.get("lockfile_version") != 2:
              sys.exit("lockfile_version が 2 ではありません")

          path_re = re.compile(r"\.mise/locks/(npm-[a-z0-9][a-z0-9._-]*/[0-9A-Za-z][0-9A-Za-z.+_-]*)")
          referenced = set()
          for tool, entries in data.get("tools", {}).items():
              for entry in entries:
                  if "uv" in entry:
                      sys.exit(f"{tool}: uv の依存グラフには対応していません")
                  graph = entry.get("aube")
                  if graph is None:
                      if tool.startswith("npm:"):
                          sys.exit(f"{tool}: 依存グラフ（aube）の参照がありません")
                      continue
                  m = path_re.fullmatch(graph.get("path", ""))
                  if not m:
                      sys.exit(f"{tool}: 想定外のサイドカーのパス: {graph.get('path')!r}")
                  rel = m.group(1)
                  aube_lock = os.path.join(sidecar_root, rel, "aube-lock.yaml")
                  package_json = os.path.join(sidecar_root, rel, "package.json")
                  if not os.path.isfile(aube_lock) or not os.path.isfile(package_json):
                      sys.exit(f"{tool}: サイドカーがありません: {rel}")
                  with open(aube_lock, "rb") as f:
                      digest = "sha256:" + hashlib.sha256(f.read()).hexdigest()
                  if graph.get("digest") != digest:
                      sys.exit(f"{tool}: サイドカーの digest が一致しません: {rel}")
                  with open(package_json, "rb") as f:
                      json.load(f)
                  referenced.add(rel)

          present = set()
          if os.path.isdir(sidecar_root):
              for root, _, files in os.walk(sidecar_root):
                  if files:
                      present.add(os.path.relpath(root, sidecar_root))
          if present - referenced:
              sys.exit(f"lock から参照されていないサイドカー: {sorted(present - referenced)}")
          PY
          done

          for stage in "${!dirs[@]}"; do
            dir="${dirs[$stage]}"
            lock="$dir/mise.lock"
            sidecars="$dir/.mise/locks"

            # 書き込み先がリポジトリ内の想定パスそのものであること
            # （PR 側で書き込み先やその親ディレクトリをシンボリックリンクにしていないこと）
            for target in "$lock" "$dir/.mise" "$sidecars"; do
              if [ -L "$target" ] || [ "$(realpath -m "$target")" != "$GITHUB_WORKSPACE/$target" ]; then
                echo "書き込み先 $target が想定外です" >&2
                exit 1
              fi
            done

            cat "$src/$stage.lock" > "$lock"

            # サイドカーは丸ごと置き換える（参照されなくなった古い版を消すため）
            rm -rf "$sidecars"
            if [ -d "$src/$stage-locks" ]; then
              (cd "$src/$stage-locks" && find . -type f -printf '%P\n') | while IFS= read -r rel; do
                install -D -m 0644 "$src/$stage-locks/$rel" "$sidecars/$rel"
              done
            fi
          done

          # 新規のサイドカーは未追跡のため、ステージしてから差分を確認する。
          # サイドカーが無いステージもあるため、各ステージの mise ディレクトリ単位で指定する
          # （書き込んだのは mise.lock と .mise/locks だけで、それ以外は checkout したままの状態）。
          git add -A -- "${dirs[@]}"
          if git diff --cached --quiet -- "${dirs[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat -- "${dirs[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push は他のワークフローを起動しないため、
      # そのままでは build-images.yml が lock 更新後のコミットで再実行されない。
      # App のトークンで push し、ビルド検証を連鎖させる。
      # 権限は lock の push に必要な Contents:write だけに絞る。
      - name: Generate GitHub App token
        if: steps.apply.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # renovate.json5 の gitIgnoredAuthors と揃えること（Renovate がPRの更新を止めないように）
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 対象（mise.lock とサイドカー）は Validate and apply lock files でステージ済み
          # 念のため hook を一切実行させない
          git -c core.hooksPath=/dev/null commit --no-verify -m 'chore(deps): mise.lock を更新する'
          # generate ジョブの基準コミットから進んでいれば non-fast-forward で失敗する
          git -c core.hooksPath=/dev/null push --no-verify \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
