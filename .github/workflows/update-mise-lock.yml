name: Update mise lock

# mise 設定は locked = true のため、config.toml だけを更新すると mise.lock と不一致になり、
# イメージのビルドが失敗する。Renovate には lock を更新させず（skipArtifactsUpdate）、
# PR上でこのワークフローが lock を作り直して push する。
#
# 【構成】PR のコードを実行する generate ジョブと、書き込み用トークンを扱う push ジョブを
# 別ジョブ（= 別 runner）に分離する。同じ runner で PR のコード実行後にトークンを扱うと、
# PR のスクリプトや侵害されたイメージが .git/hooks 等を仕込み、後続の git 操作から
# トークンを盗めるため。push ジョブでは PR のコードを一切実行せず、受け取った lock の
# パス・形式を検証してから取り込む。
on:
  pull_request:
    paths:
      - 'docker-images/**/mise/config.toml'
      - 'docker-images/**/mise/mise.lock'
      # mise 本体のバージョンが変わると lock の生成結果も変わり得る
      - 'docker-images/Dockerfile'
      - 'scripts/update-mise-locks.sh'
      - 'scripts/fill-mise-lock-checksums.sh'
      - '.github/workflows/update-mise-lock.yml'
  workflow_dispatch:

# 同一ブランチへ順に push するため、並行実行させない
concurrency:
  group: update-mise-lock-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # PR のコードを実行して lock を生成する。書き込み可能なトークン・シークレットは扱わない。
  generate:
    # フォークからのPRではシークレットを使えず、他者のブランチへ push すべきでもない
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      # push ジョブで同じコミットを基準にするため記録する（途中でブランチが進んだら push を失敗させる）
      - name: Record head commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # イメージに入る mise と同じバイナリで lock を生成するため、Dockerfile の
      # mise ステージと同じイメージ（タグ + digest）の中で実行する。
      - name: Regenerate mise.lock
        env:
          # mise lock が GitHub API を多用するため、レート制限回避用に読み取りトークンを渡す
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          image="$(sed -n 's/^FROM \(jdxcode\/mise:[^[:space:]]*\) AS mise$/\1/p' docker-images/Dockerfile)"
          if [ -z "$image" ]; then
            echo "Dockerfile から mise イメージを特定できませんでした" >&2
            exit 1
          fi
          echo "mise image: $image"

          # 公式イメージは MISE_DATA_DIR 等を root 所有の /mise に向けているため、
          # 実行ユーザが書き込める場所へ振り替える。
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --workdir /work \
            --env GITHUB_TOKEN \
            --env HOME=/tmp/home \
            --env MISE_DATA_DIR=/tmp/mise/data \
            --env MISE_CACHE_DIR=/tmp/mise/cache \
            --env MISE_CONFIG_DIR=/tmp/mise/config \
            --env MISE_STATE_DIR=/tmp/mise/state \
            --entrypoint bash \
            "$image" \
            scripts/update-mise-locks.sh

      # 受け渡すのは lock ファイルの中身だけ。パスはここで固定の名前に変換し、
      # 作業ツリーのパス構造やシンボリックリンクを持ち出さない。
      - name: Collect lock files
        run: |
          out="$RUNNER_TEMP/mise-locks"
          mkdir -p "$out"
          cat docker-images/dev-base/etc/mise/mise.lock > "$out/dev-base.lock"
          cat docker-images/ai/opt/mise/mise.lock > "$out/ai.lock"
          cat docker-images/user/opt/mise/mise.lock > "$out/user.lock"

      - name: Upload lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-locks
          path: ${{ runner.temp }}/mise-locks/
          if-no-files-found: error
          retention-days: 1

  # 検証済みの lock を PR ブランチへ push する。PR のコードは一切実行しない。
  push:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # generate ジョブと同じコミットを取得する。以降、作業ツリー内のスクリプト等は実行しない。
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.generate.outputs.sha }}
          persist-credentials: false

      # 作業ツリーの外へ展開する
      - name: Download lock files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mise-locks
          path: ${{ runner.temp }}/mise-locks

      # 受け取った lock を検証し、決まったパスにだけ書き込む。
      # （このステップのスクリプトはワークフロー定義内のもので、PR 側のファイルは使わない）
      - name: Validate and apply lock files
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mise-locks"

          declare -A dest=(
            [dev-base.lock]="docker-images/dev-base/etc/mise/mise.lock"
            [ai.lock]="docker-images/ai/opt/mise/mise.lock"
            [user.lock]="docker-images/user/opt/mise/mise.lock"
          )

          # 期待する3ファイル以外が含まれていないこと
          actual="$(cd "$src" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${!dest[@]}" | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "artifact の内容が想定と異なります:" >&2
            echo "$actual" >&2
            exit 1
          fi

          for name in "${!dest[@]}"; do
            file="$src/$name"
            target="${dest[$name]}"

            # シンボリックリンクではない通常ファイルで、サイズが妥当であること
            if [ -L "$file" ] || [ ! -f "$file" ]; then
              echo "$name が通常ファイルではありません" >&2
              exit 1
            fi
            if [ "$(stat -c %s "$file")" -gt 1048576 ]; then
              echo "$name が大きすぎます" >&2
              exit 1
            fi

            # mise.lock の形式であること（TOML として解釈でき、想定外のキーを含まない）
            python3 - "$file" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          if set(data) - {"lockfile_version", "tools"}:
              sys.exit(f"想定外のキー: {sorted(set(data) - {'lockfile_version', 'tools'})}")
          if data.get("lockfile_version") != 1:
              sys.exit("lockfile_version が 1 ではありません")
          PY

            # 書き込み先がリポジトリ内の想定パスそのものであること
            # （PR 側で書き込み先やその親ディレクトリをシンボリックリンクにしていないこと）
            if [ -L "$target" ] || [ "$(realpath -m "$target")" != "$GITHUB_WORKSPACE/$target" ]; then
              echo "書き込み先 $target が想定外です" >&2
              exit 1
            fi

            cat "$file" > "$target"
          done

          if git diff --quiet -- "${dest[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- "${dest[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push は他のワークフローを起動しないため、
      # そのままでは build-images.yml が lock 更新後のコミットで再実行されない。
      # App のトークンで push し、ビルド検証を連鎖させる。
      # 権限は lock の push に必要な Contents:write だけに絞る。
      - name: Generate GitHub App token
        if: steps.apply.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # renovate.json5 の gitIgnoredAuthors と揃えること（Renovate がPRの更新を止めないように）
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docker-images/dev-base/etc/mise/mise.lock \
            docker-images/ai/opt/mise/mise.lock \
            docker-images/user/opt/mise/mise.lock
          # 念のため hook を一切実行させない
          git -c core.hooksPath=/dev/null commit --no-verify -m 'chore(deps): mise.lock を更新する'
          # generate ジョブの基準コミットから進んでいれば non-fast-forward で失敗する
          git -c core.hooksPath=/dev/null push --no-verify \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
