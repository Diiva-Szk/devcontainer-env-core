name: Update find-docs skill

# find-docs スキル（ctx7 の SKILL.md）は rulesync で取得できず vendoring しているため、
# Renovate が mise 設定の ctx7 の版だけを上げると、スキルが古いまま残る。イメージのビルドは
# find-docs.version と ctx7 --version を照合するため、そのままでは失敗する。
# PR上でこのワークフローが同じ版のタグからスキルを作り直して push する。
#
# 【構成】update-rulesync-lock.yml と同じく、PR のコードを実行する generate ジョブと、
# 書き込み用トークンを扱う push ジョブを別ジョブ（= 別 runner）に分離する。同じ runner で
# PR のコード実行後にトークンを扱うと、PR のスクリプトや取得した内容が .git/hooks 等を
# 仕込み、後続の git 操作からトークンを盗めるため。push ジョブでは PR のコードを一切実行せず、
# 受け取ったファイルのパス・形式を検証してから取り込む。
on:
  pull_request:
    paths:
      # ctx7 の版（Renovate が更新する）
      - 'docker-images/ai/opt/mise/config.toml'
      - 'docker-images/ai/opt/rulesync/find-docs.version'
      - 'docker-images/ai/opt/rulesync/.rulesync/skills/find-docs/**'
      # 置換の内容が変わると作り直した結果も変わる
      - 'docker-images/ai/opt/rulesync/patch-find-docs.py'
      - 'scripts/update-find-docs-skill.sh'
      - '.github/workflows/update-find-docs-skill.yml'
  workflow_dispatch:

# 同一ブランチへ順に push するため、並行実行させない
concurrency:
  group: update-find-docs-skill-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # PR のコードを実行してスキルを作り直す。書き込み可能なトークン・シークレットは扱わない。
  generate:
    # フォークからのPRではシークレットを使えず、他者のブランチへ push すべきでもない
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      # push ジョブで同じコミットを基準にするため記録する（途中でブランチが進んだら push を失敗させる）
      - name: Record head commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 公開リポジトリを git で取得するだけのため、トークンは渡さない
      # （スクリプトが使う git / python3 は runner のものを使う）
      - name: Regenerate find-docs skill
        run: bash scripts/update-find-docs-skill.sh

      # 受け渡すのはファイルの中身だけ。ここで固定の名前に変換し、
      # 作業ツリーのパス構造やシンボリックリンクを持ち出さない。
      - name: Collect skill files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/find-docs"
          mkdir -p "$out"
          cat docker-images/ai/opt/rulesync/.rulesync/skills/find-docs/SKILL.md > "$out/SKILL.md"
          cat docker-images/ai/opt/rulesync/find-docs.version > "$out/find-docs.version"

      - name: Upload skill files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: find-docs
          path: ${{ runner.temp }}/find-docs/
          if-no-files-found: error
          retention-days: 1

  # 検証済みのスキルを PR ブランチへ push する。PR のコードは一切実行しない。
  push:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # generate ジョブと同じコミットを取得する。以降、作業ツリー内のスクリプト等は実行しない。
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.sha }}
          persist-credentials: false

      # 作業ツリーの外へ展開する
      - name: Download skill files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: find-docs
          path: ${{ runner.temp }}/find-docs

      # 受け取ったファイルを検証し、決まったパスにだけ書き込む。
      # （このステップのスクリプトはワークフロー定義内のもので、PR 側のファイルは使わない）
      - name: Validate and apply skill files
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/find-docs"

          declare -A targets=(
            [SKILL.md]="docker-images/ai/opt/rulesync/.rulesync/skills/find-docs/SKILL.md"
            [find-docs.version]="docker-images/ai/opt/rulesync/find-docs.version"
          )

          # artifact に含まれてよいのは、決まった名前のファイルだけ
          while IFS= read -r -d '' path; do
            rel="${path#"$src"/}"
            if [ -L "$path" ] || [ ! -f "$path" ]; then
              echo "通常ファイルではありません: $rel" >&2
              exit 1
            fi
            case "$rel" in
              SKILL.md | find-docs.version) ;;
              *) echo "想定外のファイルです: $rel" >&2; exit 1 ;;
            esac
            if [ "$(stat -c %s "$path")" -gt 1048576 ]; then
              echo "$rel が大きすぎます" >&2
              exit 1
            fi
          done < <(find "$src" -mindepth 1 -print0)

          for name in "${!targets[@]}"; do
            if [ ! -f "$src/$name" ]; then
              echo "$name がありません" >&2
              exit 1
            fi
          done

          # 版は mise 設定に書かれた ctx7 の版と一致すること（設定は読むだけで実行はしない）
          ctx7_version="$(sed -n 's/^"npm:ctx7" = "\([^"]*\)"$/\1/p' docker-images/ai/opt/mise/config.toml)"
          if [ -z "$ctx7_version" ]; then
            echo "ai の mise 設定から ctx7 のバージョンを特定できませんでした" >&2
            exit 1
          fi

          # find-docs.version は「版 + 改行」だけであること。
          # SKILL.md は UTF-8 のテキストで、find-docs のスキルの frontmatter を持ち、
          # 置換漏れ（npx ctx7 / ctx7@latest / npm install -g）が無いこと（Dockerfile の検査と同じ）。
          # -I: 作業ツリー（PR のファイル）を import の検索対象にしない（re.py 等で標準ライブラリを差し替えさせない）
          python3 -I - "$src" "$ctx7_version" <<'PY'
          import re, sys
          src, ctx7_version = sys.argv[1], sys.argv[2]

          with open(f"{src}/find-docs.version", "rb") as f:
              version = f.read()
          if not re.fullmatch(rb"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?\n", version):
              sys.exit("find-docs.version の形式が想定外です")
          if version.decode().strip() != ctx7_version:
              sys.exit(f"find-docs.version（{version.decode().strip()}）が ctx7 の版（{ctx7_version}）と一致しません")

          with open(f"{src}/SKILL.md", "rb") as f:
              try:
                  skill = f.read().decode("utf-8")
              except UnicodeDecodeError:
                  sys.exit("SKILL.md が UTF-8 ではありません")
          m = re.match(r"---\n(.*?)\n---\n", skill, re.DOTALL)
          if not m or not re.search(r"^name: find-docs$", m.group(1), re.MULTILINE):
              sys.exit("SKILL.md に find-docs の frontmatter がありません")
          for leftover in ("npx ctx7", "ctx7@latest", "npm install -g"):
              if leftover in skill:
                  sys.exit(f"SKILL.md に {leftover} が残っています（置換漏れ）")
          PY

          for name in "${!targets[@]}"; do
            dest="${targets[$name]}"

            # 書き込み先がリポジトリ内の想定パスそのものであること
            # （PR 側で書き込み先やその親ディレクトリをシンボリックリンクにしていないこと）
            if [ -L "$dest" ] || [ "$(realpath -m "$dest")" != "$GITHUB_WORKSPACE/$dest" ]; then
              echo "書き込み先 $dest が想定外です" >&2
              exit 1
            fi

            cat "$src/$name" > "$dest"
          done

          git add -A -- "${targets[@]}"
          if git diff --cached --quiet -- "${targets[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat -- "${targets[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$ctx7_version" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push は他のワークフローを起動しないため、
      # そのままでは build-images.yml がスキル更新後のコミットで再実行されない。
      # App のトークンでコミットし、ビルド検証を連鎖させる。
      # lock の更新と同じく、Renovate とは別の Contents:write だけを持つ lock 更新用の App を使う
      # （秘密鍵が漏れても、Renovate の App の権限までは渡らないように）。
      # トークンの権限も、コミットの作成に必要な Contents:write だけに絞る。
      - name: Generate GitHub App token
        if: steps.apply.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LOCK_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write

      # git commit / push ではなく GraphQL の createCommitOnBranch でコミットを作る。
      # ランナーには署名鍵が無く、ランナー上の git で作ったコミットは署名されない。
      # API で作ったコミットは GitHub が署名する（Verified）ため、ブランチの
      # 「署名付きコミットのみ許可」を満たせる。
      # コミットの作者は lock 更新用の App の bot（renovate.json5 の gitIgnoredAuthors に登録済み）になる。
      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ needs.generate.outputs.sha }}
          CTX7_VERSION: ${{ steps.apply.outputs.version }}
        run: |
          set -euo pipefail
          changes="$RUNNER_TEMP/commit-changes"
          payload="$RUNNER_TEMP/commit-payload.json"
          # 対象（SKILL.md / find-docs.version）は Validate and apply skill files でステージ済み。
          # ステージ済みの差分から追加・変更・削除するファイルを組み立てる。
          git diff --cached --name-status --no-renames -z > "$changes"
          # -I: 作業ツリー（PR のファイル）を import の検索対象にしない（base64.py 等で標準ライブラリを差し替えさせない）
          python3 -I - "$changes" > "$payload" <<'PY'
          import base64, json, os, sys
          with open(sys.argv[1], "rb") as f:
              fields = f.read().split(b"\0")
          additions, deletions = [], []
          for status, path in zip(fields[0::2], fields[1::2]):
              path = path.decode()
              if status == b"D":
                  deletions.append({"path": path})
              else:
                  with open(path, "rb") as f:
                      additions.append({"path": path, "contents": base64.b64encode(f.read()).decode()})
          query = """
          mutation ($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }
          """
          json.dump({
              "query": query,
              "variables": {"input": {
                  "branch": {
                      "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                      "branchName": os.environ["BRANCH"],
                  },
                  "message": {"headline": f"chore(deps): find-docs スキルを ctx7 {os.environ['CTX7_VERSION']} に揃える"},
                  # generate ジョブの基準コミットから進んでいれば失敗する
                  "expectedHeadOid": os.environ["HEAD_SHA"],
                  "fileChanges": {"additions": additions, "deletions": deletions},
              }},
          }, sys.stdout)
          PY
          gh api graphql --input "$payload" --jq '.data.createCommitOnBranch.commit.url'
