# mise - dev-base 共通ツール設定
# https://mise.jdx.dev/
#
# ai / user 共通のベース設定。イメージ内では /etc/mise/config.toml（system スコープ）に
# root 所有で配置され、各ステージの global 設定（/opt/mise/config.toml）と合成される。
#
# ツールは backend を明示して記述する（例: "aqua:jqlang/jq"）。
# 短縮名（jq など）は mise のレジストリ次第で解決先の backend が変わり得るため使わない。
#
# 【重要】ツールを追加・更新したら同じディレクトリの mise.lock も更新すること。
#   bash scripts/update-mise-locks.sh
# （mise lock 単体ではチェックサムが欠ける成果物があるため、スクリプト経由で実行する）
# PR 上では update-mise-lock ワークフローが自動で追従する。

[settings]
# lockfile に記録されていないツールのインストールを拒否し、記録済みのチェックサムで検証する。
# （mise 自体はチェックサムの欠落を拒否しないため、欠落は build-images ワークフローで検出する。
#   これらを合わせて aqua の require_checksum 相当とする）
locked = true
# ワークスペース（project スコープ）の mise.toml は、実行中に足すツール用のため lock を必須にしない。
# locked_scopes は system / global 設定でしか指定できず、project 側から緩められない。
locked_scopes = ["system", "global"]

[tools]
# tools
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:cli/cli" = "2.103.3"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:secretlint/secretlint" = "13.1.0"
"aqua:max-sixty/worktrunk" = "0.81.0"
# languages
#   Python は python-build-standalone のビルド済みバイナリ、Node は nodejs.org の公式バイナリが入る。
#   どちらも mise.lock に URL とチェックサムが記録される（Python は GitHub Artifact Attestations 付き）。
"core:python" = "3.15.2"
"core:node" = "24.22.2"             # LTS のみ（Renovate も LTS 以外へは更新しない）
# lang managers tools
"aqua:astral-sh/uv" = "0.13.6"       # Python パッケージ管理（Python 本体は mise が入れる）
"aqua:tfutils/tfenv" = "3.2.2"       # Terraform
# terraform
"aqua:terraform-linters/tflint" = "0.65.0"
"aqua:terraform-docs/terraform-docs" = "0.24.0"
# cloud tools
"aqua:twistedpair/google-cloud-sdk" = "562.0.0"
"aqua:aws/aws-cli" = "2.39.0"
# Wrangler（Cloudflare の CLI。Workers / Pages / R2 / D1 / KV などを操作する）
#   npm でのみ配布されているため npm backend で入れる（サイドカーの扱いは ai の playwright-cli と同じ）。
#   テレメトリは Dockerfile の WRANGLER_SEND_METRICS で止める。
"npm:wrangler" = "4.154.0"

# 必要に応じて ai/user 共通ツールを追加

# Local Markdown Mail（lmm。ローカルのファイルだけで AI エージェントと人が Markdown のメッセージをやり取りする CLI）
#   aqua レジストリに無いため github backend で取得する。静的リンクの musl 版を使う。
#   アーカイブは lmm-v<版>-<target>/ の下に lmm・LICENSE・THIRD-PARTY-LICENSES.txt などを持つため、
#   先頭ディレクトリは自動で除去され、lmm は展開先の直下に置かれる（bin_path・strip_components は不要）。
#   asset_pattern をプラットフォームごとに指定する理由は ai の codex と同じ。
#   送信者（name）とデータディレクトリ（data_dir）は lmm が .lmm.yml / .lmm.local.yml から決めるため、
#   作業ツリーごとに環境変数を切り替えるラッパーは置かない。
[tools."github:szk302/local-markdown-mail"]
version = "0.2.0"

[tools."github:szk302/local-markdown-mail".platforms]
linux-x64 = { asset_pattern = "lmm-*-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "lmm-*-aarch64-unknown-linux-musl.tar.gz" }

# AWS Session Manager plugin（aws ssm start-session などで AWS CLI が PATH から呼び出す）
#   aqua レジストリの定義は macOS 専用で、GitHub リリースにも成果物が無いため、
#   配布元（S3）の .deb を http backend で取得する。配布元はチェックサムを提供しないため、
#   mise.lock のチェックサムは fill-mise-lock-checksums.sh が補う。
#   mise は .deb を展開せず1つのファイルとして置くため、postinstall で dpkg-deb -x により
#   インストール先へ展開する。bin_path を指定すると、ダウンロードしたファイルは bin_path の下に
#   置かれるため、展開後に消す（残すと session-manager-plugin.deb の shim ができる）。
#   .deb にある systemd / upstart の定義は展開されるだけで使われない。
#   版は 1.2.896.0 のような4桁で semver ではないため、Renovate では loose で比較する。
[tools."http:session-manager-plugin"]
# renovate: datasource=github-releases depName=aws/session-manager-plugin versioning=loose
version = "1.2.896.0"
url = 'https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/{{ arch(x64="ubuntu_64bit", arm64="ubuntu_arm64") }}/session-manager-plugin.deb'
bin_path = "usr/local/sessionmanagerplugin/bin"
postinstall = 'deb="$MISE_TOOL_INSTALL_PATH/usr/local/sessionmanagerplugin/bin/session-manager-plugin.deb" && dpkg-deb -x "$deb" "$MISE_TOOL_INSTALL_PATH" && rm "$deb"'

# Worktrunk の操作（ai / user 共通）。追加の引数はそのまま wt に渡す。
# mise は子プロセスなので親シェルを cd できない。switch は --no-cd で移動せずに終える。
# dir: system スコープの設定の場所ではなく、呼び出したディレクトリで実行する。
# raw: Worktrunk の対話入力と出力を直接端末へ接続する。
# raw_args: --help なども Worktrunk へ渡す。hooks の承認は自動化しない。
[tasks."wt:add"]
description = "[global] 現在の HEAD から新しいブランチと worktree を作る（移動しない）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = '''
#!/usr/bin/env bash
# --base の重複は Worktrunk が拒否するため、指定がない場合だけ HEAD を補う。
for arg in "$@"; do
  [[ "$arg" == -- ]] && break # 以降は --execute 先の引数。
  # -bmain や -vb main のような短縮オプションの指定も認識する。
  if [[ "$arg" == --base || "$arg" == --base=* || "$arg" =~ ^-[chvy]*b ]]; then
    exec wt switch --create --no-cd "$@"
  fi
done
exec wt switch --create --no-cd --base HEAD "$@"
'''

[tasks."wt:switch"]
description = "[global] Worktrunk で既存ブランチの worktree を用意・選択する（移動しない）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "wt switch --no-cd"

[tasks."wt:list"]
description = "[global] Worktrunk で worktree と変更状況の一覧を表示する"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "wt list"

[tasks."wt:rm"]
description = "[global] Worktrunk で worktree を削除し、完了を待つ（統合済みならブランチも削除）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "wt remove --foreground"

# クラウドの CLI のログイン（ai / user 共通）。追加の引数はそのまま各 CLI に渡す（mise run login:aws-sso --profile dev）。
# コンテナでは、CLI がブラウザを起動できなかったり、ブラウザから localhost のコールバックへ戻れなかったりして
# ログインに失敗しやすい。そのため、表示された URL を手元のブラウザで開き、デバイスコードの確認か
# 認可コードの貼り付けで終える方式（localhost のコールバックを使わない方式）に固定する。
# dir: 呼び出したディレクトリで実行する（ワークスペースの mise.toml の env を効かせるため）。
# raw: コードの入力や確認の対話を直接端末へ接続する。
# raw_args: --help なども各 CLI へ渡す。
#
# gh: デバイスコード方式（--web）。Enter で開くブラウザ（GH_BROWSER）は何もしないコマンドにし、
#     表示された URL を手で開く。git の操作も https で gh の認証を使えるようにする（確認が出る）。
[tasks."login:gh"]
description = "[global] GitHub CLI にブラウザなしでログインする（デバイスコード）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
env = { GH_BROWSER = "true" }
run = "gh auth login --hostname github.com --git-protocol https --web"

# aws（IAM Identity Center）: デバイスコード方式。プロファイルは事前に
# `aws configure sso --use-device-code --no-browser` で作っておく（この設定でもブラウザは不要）。
[tasks."login:aws-sso"]
description = "[global] AWS CLI に IAM Identity Center（SSO）でブラウザなしでログインする（デバイスコード）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "aws sso login --use-device-code --no-browser"

# aws（コンソールの認証情報）: ログイン後にブラウザに表示される認可コードを端末へ貼り付ける。
[tasks."login:aws"]
description = "[global] AWS CLI にコンソールの認証情報でブラウザなしでログインする（認可コードを貼り付ける）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "aws login --remote"

# gcloud: ログイン後にブラウザに表示される認可コードを端末へ貼り付ける。
#   --no-browser（gcloud の入った別のマシンで続きを実行する方式）ではなく --no-launch-browser を使う。
#   アプリケーションのデフォルト認証情報（ADC）も更新するときは --update-adc を付ける。
[tasks."login:gcloud"]
description = "[global] Google Cloud CLI にブラウザなしでログインする（認可コードを貼り付ける）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "gcloud auth login --no-launch-browser"

# az: デバイスコード方式。
[tasks."login:az"]
description = "[global] Azure CLI にブラウザなしでログインする（デバイスコード）"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "az login --use-device-code"
