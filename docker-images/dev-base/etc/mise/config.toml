# mise - dev-base 共通ツール設定
# https://mise.jdx.dev/
#
# ai / user 共通のベース設定。イメージ内では /etc/mise/config.toml（system スコープ）に
# root 所有で配置され、各ステージの global 設定（/opt/mise/config.toml）と合成される。
#
# ツールは backend を明示して記述する（例: "aqua:jqlang/jq"）。
# 短縮名（jq など）は mise のレジストリ次第で解決先の backend が変わり得るため使わない。
#
# 【重要】ツールを追加・更新したら同じディレクトリの mise.lock も更新すること。
#   bash scripts/update-mise-locks.sh
# （mise lock 単体ではチェックサムが欠ける成果物があるため、スクリプト経由で実行する）
# PR 上では update-mise-lock ワークフローが自動で追従する。

[settings]
# lockfile に記録されていないツールのインストールを拒否し、記録済みのチェックサムで検証する。
# （mise 自体はチェックサムの欠落を拒否しないため、欠落は build-images ワークフローで検出する。
#   これらを合わせて aqua の require_checksum 相当とする）
locked = true
# ワークスペース（project スコープ）の mise.toml は、実行中に足すツール用のため lock を必須にしない。
# locked_scopes は system / global 設定でしか指定できず、project 側から緩められない。
locked_scopes = ["system", "global"]

[tools]
# tools
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:cli/cli" = "2.100.0"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:secretlint/secretlint" = "13.0.5"
# languages
#   Python は python-build-standalone のビルド済みバイナリ、Node は nodejs.org の公式バイナリが入る。
#   どちらも mise.lock に URL とチェックサムが記録される（Python は GitHub Artifact Attestations 付き）。
"core:python" = "3.14.7"
"core:node" = "24.21.0"             # LTS のみ（Renovate も LTS 以外へは更新しない）
# lang managers tools
"aqua:astral-sh/uv" = "0.12.13"       # Python パッケージ管理（Python 本体は mise が入れる）
"aqua:tfutils/tfenv" = "3.2.2"       # Terraform
# terraform
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:terraform-docs/terraform-docs" = "0.24.0"
# cloud tools
"aqua:twistedpair/google-cloud-sdk" = "562.0.0"
"aqua:aws/aws-cli" = "2.36.45"

# 必要に応じて ai/user 共通ツールを追加

# ---------------------------------------------------------------------------
# git worktree を .worktree/<ブランチ名> で管理するタスク（ai / user 共通）
#   dir: この設定は system スコープのため {{config_root}} はリポジトリを指さない。
#        実行したディレクトリで起動し、git でリポジトリのメインの worktree に移動する
#        （worktree の中で実行しても同じ .worktree を使い、サブモジュールの中ではサブモジュールの
#        .worktree を使う。git worktree list の先頭はサブモジュールだと .git/modules を指すため使わない）。
#        移動先は変数に代入してから cd する（cd "$(...)" だと置換の中の失敗で set -e が働かず、
#        cd "" で実行したディレクトリに留まったまま続行してしまう）。
#   quiet: mise は set の行を飛ばした次の行（コメント）を実行内容として表示するため、表示を止める。
#   description: mise tasks の一覧でプロジェクトのタスクと区別できるよう、イメージが提供する
#        タスクには先頭に [global] を付ける（user/opt/mise/config.toml のタスクも同じ）。
# ---------------------------------------------------------------------------
[tasks."wt:add"]
description = "[global] .worktree/<ブランチ名> に worktree を作る。ブランチがなければ origin のブランチか分岐元から作成する"
dir = "{{cwd}}"
quiet = true
usage = '''
arg "<branch>" help="ブランチ名"
flag "-b --base <base>" help="ローカルにも origin にもブランチが無いときの分岐元" default="main"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# メインの worktree のルートへ移動する（worktree の中・サブモジュールでも同じリポジトリを指す）
common="$(git rev-parse --path-format=absolute --git-common-dir)"
top="$(cd "$common/.." && git --git-dir="$common" rev-parse --show-toplevel)"
cd "$top"
git check-ref-format --branch "$usage_branch" > /dev/null
if git show-ref --verify --quiet "refs/heads/$usage_branch"; then
  git worktree add ".worktree/$usage_branch" "$usage_branch"
elif git show-ref --verify --quiet "refs/remotes/origin/$usage_branch"; then
  # origin にだけあるブランチは、それを追跡するブランチを作る（素の git worktree add と同じ動作）
  git worktree add --track -b "$usage_branch" ".worktree/$usage_branch" "origin/$usage_branch"
else
  git worktree add -b "$usage_branch" ".worktree/$usage_branch" "$usage_base"
fi
'''

[tasks."wt:rm"]
description = "[global] .worktree/<ブランチ名> の worktree とそのブランチを削除する"
dir = "{{cwd}}"
quiet = true
usage = '''
arg "<branch>" help="削除するブランチ名"
flag "-f --force" help="未コミットの変更や未マージのコミットがあっても削除する"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# メインの worktree のルートへ移動する（worktree の中・サブモジュールでも同じリポジトリを指す）
common="$(git rev-parse --path-format=absolute --git-common-dir)"
top="$(cd "$common/.." && git --git-dir="$common" rev-parse --show-toplevel)"
cd "$top"
force="${usage_force:-false}"
if ! git show-ref --verify --quiet "refs/heads/$usage_branch"; then
  echo "error: ブランチ '$usage_branch' がありません" >&2
  exit 1
fi
if [ "$force" != "true" ]; then
  # worktree を消す前に、git branch -d と同じ基準（upstream、無ければ HEAD）でマージ済みか確かめる。
  # 後から branch -d で止まると、worktree だけが消えた状態になるため
  target="$(git rev-parse --verify --quiet "$usage_branch@{upstream}" || git rev-parse HEAD)"
  if ! git merge-base --is-ancestor "refs/heads/$usage_branch" "$target"; then
    echo "error: ブランチ '$usage_branch' には未マージのコミットがあります（-f で強制的に削除できます）" >&2
    exit 1
  fi
fi
# worktree が既に無い場合（手で消した・前回の実行が途中で止まったなど）は、ブランチの削除から続ける
if [ -e ".worktree/$usage_branch" ]; then
  if [ "$force" = "true" ]; then
    git worktree remove --force ".worktree/$usage_branch"
  else
    git worktree remove ".worktree/$usage_branch"
  fi
fi
# 登録だけ残った worktree があると branch -d/-D が拒否するため、片付けてから消す
git worktree prune
if [ "$force" = "true" ]; then
  git branch -D "$usage_branch"
else
  git branch -d "$usage_branch"
fi
parent="$(dirname "$usage_branch")"
if [ "$parent" != "." ]; then
  (cd .worktree && rmdir -p --ignore-fail-on-non-empty "$parent")
fi
'''

[tasks."wt:list"]
description = "[global] worktree の一覧を表示する"
dir = "{{cwd}}"
run = "git worktree list"
