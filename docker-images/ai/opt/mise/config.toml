# mise - ai 専用ツール設定
# イメージ内では /opt/mise/config.toml に root 所有で配置し、
# MISE_GLOBAL_CONFIG_FILE で global スコープとして読み込ませる。
# （dev-base の /etc/mise/config.toml と合成される）
#
# 【重要】ツールを追加・更新したら同じディレクトリの mise.lock も更新すること。
#   bash scripts/update-mise-locks.sh
# （mise lock 単体ではチェックサムが欠ける成果物があるため、スクリプト経由で実行する）

[tools]
# ai tools
"aqua:anthropics/claude-code" = "2.1.278"
"aqua:github/copilot-cli" = "1.0.86"
"aqua:github/copilot-language-server-release" = "1.547.0"
"aqua:google-antigravity/antigravity-cli" = "1.2.7"
# AI エージェント向けのルール・設定を各ツールの形式で生成する CLI
"aqua:dyoshikawa/rulesync" = "16.39.1"

# Playwright CLI（コーディングエージェント向けのブラウザ操作 CLI）
#   npm でのみ配布されているため npm backend で入れる。mise lock が依存グラフを
#   integrity 付きで .mise/locks/ のサイドカー（package.json / aube-lock.yaml）に書き出し、
#   mise.lock にはその digest が記録される。サイドカーも mise.lock と一緒にコミットすること。
#   ブラウザは Debian の Chromium を使う（Dockerfile の PLAYWRIGHT_MCP_EXECUTABLE_PATH）。
"npm:@playwright/cli" = "0.1.21"

# OpenAI Codex CLI
#   aqua backend では linux 向け成果物を解決できず lock が生成されなかったため、github backend で取得する。
#   タグは rust-v0.120.0 形式。静的リンクの musl 版を使う（アーカイブ内の実行ファイル名はターゲット名付き）。
#   asset_pattern に {{ arch() }} を使うと mise lock を実行したマシンのアーキテクチャで展開され、
#   全プラットフォームに同じ成果物が記録されてしまうため、プラットフォームごとに指定する。
[tools."github:openai/codex"]
version = "0.155.1"
version_prefix = "rust-v"
rename_exe = "codex"

[tools."github:openai/codex".platforms]
linux-x64 = { asset_pattern = "codex-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "codex-aarch64-unknown-linux-musl.tar.gz" }

# Amazon Kiro CLI
#   GitHub リリースも aqua レジストリも無いため http backend で取得する。
#   配布元はバージョン別のマニフェストを公開しておらず、latest/manifest.json のみ存在する。
#   そのためチェックサムは「latest のマニフェストに同一 URL の成果物が載っていればそこから取る」。
#   載っていない（latest が先に進んだ）場合、mise lock は成果物を実際にダウンロードして計算する。
[tools."http:kiro-cli"]
# renovate: datasource=custom.kiro-cli depName=kiro-cli
version = "2.22.1"
url = 'https://desktop-release.q.us-east-1.amazonaws.com/{{ version }}/kirocli-{{ arch(x64="x86_64", arm64="aarch64") }}-linux.tar.gz'
checksum_url = "https://desktop-release.q.us-east-1.amazonaws.com/latest/manifest.json"
checksum_expr = '"sha256:" + filter(fromJSON(body).packages, { "https://desktop-release.q.us-east-1.amazonaws.com/" + #.download == url })[0].sha256'
# アーカイブは kirocli/bin/kiro-cli の構成。bin_path を指定すると先頭ディレクトリの
# 自動除去が無効になるため、strip_components も明示する。
strip_components = 1
bin_path = "bin"
