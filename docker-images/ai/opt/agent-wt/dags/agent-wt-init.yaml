# agent-wt-init
#   agent-wt-create が読む設定（<REPO>/.agent-wt/）の雛形をプロジェクトに作る。
#   既にある設定は上書きせず、root のメール環境も初期化する。
#
#   使い方（ai コンテナ内の対象プロジェクトのルートで）:
#     dagu start agent-wt-init
description: agent-wt の設定の雛形とプロジェクトルートのメール環境を作る
type: graph
shell: ["bash", "-euo", "pipefail"]
working_dir: ${REPO}

params:
  - name: REPO
    type: string
    default: "."
    description: 対象のプロジェクト（既定は dagu を実行したディレクトリ）

steps:
  - id: init
    run: |
      repo="$(git rev-parse --show-toplevel)"
      [ "$(git rev-parse --path-format=absolute --git-dir)" = "$(git rev-parse --path-format=absolute --git-common-dir)" ] \
        || { echo 'プロジェクトのメインの作業ツリーから実行してください' >&2; exit 1; }
      dest="${repo}/.agent-wt"
      if [ -e "${dest}" ]; then
        [ -d "${dest}" ] || { echo "ディレクトリではありません: ${dest}" >&2; exit 1; }
        echo "既存の設定を使います: ${dest}"
      else
        # 雛形は root 所有・読み取り専用で置いているため、権限は引き継がない
        cp -r --no-preserve=mode,ownership /opt/agent-wt/template "${dest}"
        echo "作成しました: ${dest}"
      fi
      agent-wt-mail "${repo}" root
      find "${dest}" -type f | sort
