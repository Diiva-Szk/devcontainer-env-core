# agent-wt-remove
#   agent-wt-create で作った git worktree を、配置した設定ファイルごと削除する。
#
#   メールボックスとメールの履歴は残す。同じ NAME で再作成すると引き継ぐ。
#   使い方（ai コンテナ内の対象プロジェクトのルートで）:
#     dagu start agent-wt-remove -- NAME=login-coder
#     dagu start agent-wt-remove -- NAME=login-coder DELETE_BRANCH=true
#     dagu start agent-wt-remove -- NAME=login-coder DISCARD_DRAFTS=true
#
#   worktree の削除は Worktrunk（wt remove）で行う。
#   Git が検出する未コミットの変更・未追跡のファイルが残っていると
#   wt remove が失敗し、何も消さない。捨ててよい場合は FORCE=true を渡す。
#   Git が無視する .lmm-drafts/ も別途検査し、下書きが残っていれば止める。
#   DISCARD_DRAFTS=true は下書きの破棄だけを許可し、Git の検査は続ける。
#   FORCE=true は下書きも含めて強制削除する。
#   lmm post は下書きを消さないため、送信済みの下書きも対象。受信の展開コピーは削除する。
#   ブランチは既定では残す。DELETE_BRANCH=true でブランチも消す
#   （マージされていないブランチは FORCE=true のときだけ消す。FORCE=true が無ければ、
#   worktree も消さずに止まる）。
description: agent-wt-create で作った git worktree を設定ファイルごと削除する
type: graph
shell: ["bash", "-euo", "pipefail"]
working_dir: ${REPO}
max_active_runs: 1

params:
  - name: NAME
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    description: worktree の名前（<REPO>/.worktrees/<NAME>）
  - name: DELETE_BRANCH
    type: boolean
    default: false
    description: ブランチも削除する
  - name: FORCE
    type: boolean
    default: false
    description: 未コミットの変更・下書きがあっても削除する（マージされていないブランチも削除する）
  - name: DISCARD_DRAFTS
    type: boolean
    default: false
    description: 下書きの破棄を許可する（未コミットの変更・未マージのコミットの検査は続ける）
  - name: REPO
    type: string
    default: "."
    description: 対象のプロジェクト（既定は dagu を実行したディレクトリ）

steps:
  - id: remove
    description: worktree を削除し、.git/info/exclude のブロックを消し、必要ならブランチも消す
    run: |
      repo="$(git rev-parse --show-toplevel)"
      [ "$(git rev-parse --path-format=absolute --git-dir)" = "$(git rev-parse --path-format=absolute --git-common-dir)" ] \
        || { echo 'プロジェクトのメインの作業ツリーから実行してください' >&2; exit 1; }
      wt="${repo}/.worktrees/${NAME}"

      if ! git -C "${wt}" rev-parse --is-inside-work-tree >/dev/null 2>&1 \
         || [ "$(git -C "${wt}" rev-parse --show-toplevel)" != "${wt}" ]; then
        echo "worktree がありません: ${wt}" >&2
        exit 1
      fi

      # 作成時の情報（agent-wt-create が書く。手で作った worktree には無い）
      git_dir="$(git -C "${wt}" rev-parse --path-format=absolute --git-dir)"
      branch="$(git -C "${wt}" symbolic-ref --quiet --short HEAD || true)"
      if [ -f "${git_dir}/agent-wt.env" ]; then
        # 作成後に git switch された場合は、記録より現在のブランチを優先する。
        (source "${git_dir}/agent-wt.env"; echo "role: ${role}, profile: ${profile}")
      fi
      echo "branch: ${branch:-（detached HEAD）}"

      # .lmm-drafts/ は Git の除外対象なので wt remove では保護されない。
      # 空のディレクトリと lmm が置くルート直下の .gitignore だけなら削除してよい。
      if [ "${FORCE}" != true ] && [ "${DISCARD_DRAFTS}" != true ] && [ -d "${wt}/.lmm-drafts" ]; then
        # プロジェクトのパスに [ などがあっても find のパターンに含めない。
        draft="$(cd "${wt}/.lmm-drafts" && find . -mindepth 1 ! -type d \
          ! -path ./.gitignore -print -quit)"
        if [ -n "${draft}" ]; then
          echo "下書きが残っているため削除しません: ${wt}/.lmm-drafts" >&2
          echo '必要な下書きを退避・整理するか、下書きを捨ててよければ DISCARD_DRAFTS=true を渡してください' >&2
          echo 'DISCARD_DRAFTS=true でも未コミットの変更・未マージのコミットの検査は行います' >&2
          exit 1
        fi
      fi

      # wt remove は未マージでも worktree を消してブランチだけ残す。
      # DAG は従来どおり、ブランチ削除を指定して未マージなら何も消さずに止める。
      if [ "${DELETE_BRANCH}" = true ] && [ -n "${branch}" ] && [ "${FORCE}" != true ]; then
        target="$(git rev-parse --verify --quiet "${branch}@{upstream}" || git -C "${repo}" rev-parse HEAD)"
        if ! git merge-base --is-ancestor "refs/heads/${branch}" "${target}"; then
          echo "ブランチ '${branch}' には未マージのコミットがあるため削除しません" >&2
          git -C "${wt}" status --short >&2
          exit 1
        fi
      fi

      # 作業ツリーの検査・削除は Worktrunk に任せ、完了後にブランチと設定を片付ける。
      # ブランチは上と同じ基準（upstream、無ければメインの HEAD）で git branch に検査させる。
      args=(--foreground --no-hooks --no-delete-branch)
      if [ "${FORCE}" = true ]; then
        args+=(--force)
      fi
      if ! wt -C "${repo}" remove "${args[@]}" "${wt}"; then
        echo "削除しませんでした。捨ててよければ FORCE=true を渡してください" >&2
        if [ -e "${wt}" ]; then
          git -C "${wt}" status --short >&2
        fi
        exit 1
      fi
      echo "削除しました: ${wt}"

      if [ "${DELETE_BRANCH}" = true ] && [ -n "${branch}" ]; then
        if [ "${FORCE}" = true ]; then
          git -C "${repo}" branch -D -- "${branch}"
        else
          git -C "${repo}" branch -d -- "${branch}"
        fi
      fi

      exclude="$(git rev-parse --path-format=absolute --git-common-dir)/info/exclude"
      if [ -f "${exclude}" ]; then
        # NAME のうち、sed の基本正規表現で特別な意味を持つのは "."。
        name_re="${NAME//./\\.}"
        sed -i "/^# >>> agent-wt:${name_re}\$/,/^# <<< agent-wt:${name_re}\$/d" "${exclude}"
      fi
