# agent-wt-remove
#   agent-wt-create で作った git worktree を、配置した設定ファイルごと削除する。
#
#   使い方（ai コンテナ内のどこからでも可）:
#     dagu start agent-wt-remove -- NAME=login-coder
#     dagu start agent-wt-remove -- NAME=login-coder DELETE_BRANCH=true
#
#   削除は git-wt rm（mise の wt:rm と同じスクリプト）で行う。
#   作業中の変更（生成したファイル以外の未コミットの変更・未追跡のファイル）が残っていると
#   git worktree remove が失敗し、何も消さない。捨ててよい場合は FORCE=true を渡す。
#   ブランチは既定では残す。DELETE_BRANCH=true でブランチも消す
#   （マージされていないブランチは FORCE=true のときだけ消す。FORCE=true が無ければ、
#   worktree も消さずに止まる）。
description: agent-wt-create で作った git worktree を設定ファイルごと削除する
type: graph
shell: ["bash", "-euo", "pipefail"]
working_dir: ${REPO}
max_active_runs: 1

params:
  - name: NAME
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    description: worktree の名前（<REPO>/.worktrees/<NAME>）
  - name: DELETE_BRANCH
    type: boolean
    default: false
    description: ブランチも削除する
  - name: FORCE
    type: boolean
    default: false
    description: 未コミットの変更があっても削除する（マージされていないブランチも削除する）
  - name: REPO
    type: string
    default: /home/dev/work
    pattern: '^/[A-Za-z0-9._/-]*$'
    description: 対象のリポジトリ（ai コンテナではプロジェクトルートが /home/dev/work）

steps:
  - id: remove
    description: worktree を削除し、.git/info/exclude のブロックを消し、必要ならブランチも消す
    run: |
      repo="$(git rev-parse --show-toplevel)"
      wt="${repo}/.worktrees/${NAME}"

      if ! git -C "${wt}" rev-parse --is-inside-work-tree >/dev/null 2>&1 \
         || [ "$(git -C "${wt}" rev-parse --show-toplevel)" != "${wt}" ]; then
        echo "worktree がありません: ${wt}" >&2
        exit 1
      fi

      # 作成時の情報（agent-wt-create が書く。手で作った worktree には無い）
      git_dir="$(git -C "${wt}" rev-parse --path-format=absolute --git-dir)"
      branch="$(git -C "${wt}" symbolic-ref --quiet --short HEAD || true)"
      if [ -f "${git_dir}/agent-wt.env" ]; then
        source "${git_dir}/agent-wt.env"
        echo "role: ${role}, profile: ${profile}, branch: ${branch}"
      fi

      # 生成したファイルは skip-worktree・exclude で隠しているため、それ以外の変更があるときだけ
      # 削除が失敗する。ブランチも消すときは、未マージなら worktree も消さずに止まる（git-wt rm）
      args=(--name "${NAME}")
      if [ "${FORCE}" = true ]; then
        args+=(--force)
      fi
      if [ "${DELETE_BRANCH}" = true ] && [ -n "${branch}" ]; then
        args+=(-- "${branch}")
      else
        args+=(--keep-branch)
      fi
      if ! git-wt rm "${args[@]}"; then
        echo "削除しませんでした。捨ててよければ FORCE=true を渡してください" >&2
        if [ -e "${wt}" ]; then
          git -C "${wt}" status --short >&2
        fi
        exit 1
      fi
      echo "削除しました: ${wt}"

      exclude="$(git rev-parse --path-format=absolute --git-common-dir)/info/exclude"
      if [ -f "${exclude}" ]; then
        sed -i "/^# >>> agent-wt:${NAME}\$/,/^# <<< agent-wt:${NAME}\$/d" "${exclude}"
      fi
